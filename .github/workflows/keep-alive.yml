name: Keep backend awake

on:
  schedule:
    # Every 10 minutes — well under Render's ~15 minute idle-sleep window
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf --max-time 30 https://gcc-wrc-dev.onrender.com/ || echo "Ping failed (backend may be waking up or temporarily down)"
